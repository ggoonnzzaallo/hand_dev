[project]
name = "hand-dev"
version = "0.1.0"
description = "CamControls UI — hand tracking launcher (uv run launch)"
requires-python = ">=3.12"
dependencies = [
    "rustypot>=1.5.0",
    "mediapipe>=0.10.14,<=0.10.15",
    "ahsimulation",
    "handtracking",
    "webui",
]

[project.scripts]
launch = "launch:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["launch", "launch_serial", "launch_camera", "launch_shutdown"]

[tool.uv.workspace]
members = [".", "AHSimulation", "HandTracking", "WebUI"]

[tool.uv.sources]
ahsimulation = { workspace = true }
handtracking = { workspace = true }
webui = { workspace = true }
