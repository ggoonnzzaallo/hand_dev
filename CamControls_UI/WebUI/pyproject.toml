[project]
name = "WebUI"
version = "0.1.0"
description = "Browser control panel for CamControls UI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs>=0.3.11,<=0.3.13",
    "fastapi>=0.115.0",
    "opencv-python>=4.8.0",
    "pyarrow>=14.0.0",
    "pyserial>=3.5",
    "rustypot>=1.5.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["WebUI*"]

[tool.setuptools.package-data]
WebUI = ["static/*"]
